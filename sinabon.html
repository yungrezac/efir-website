<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b120e">
  <meta name="description" content="Sinabon — полезные ссылки и правила таймера.">
  <title>SINABON · EFIR launcher</title>
  <link rel="canonical" href="https://efirlive.pro/sinabon">
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/creator.css?v=1">
  <script src="/creator.js?v=1" defer></script>
</head>
<body>
  <main class="creator-page">
    <section class="portrait-stage" aria-labelledby="creator-name">
      <div class="halo" aria-hidden="true"></div>
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>
      <div class="portrait-wrap"><img class="portrait" src="/assets/creators/sinabon.png" width="1086" height="1448" alt="Sinabon указывает на полезные ссылки" fetchpriority="high"></div>
      <header class="identity">
        <a class="brand" href="/" aria-label="EFIR launcher — главная"><img src="/assets/favicon.svg" width="40" height="40" alt=""><span><strong>EFIR</strong><small>launcher</small></span></a>
        <div class="name-block"><span class="eyebrow">НА СВЯЗИ</span><h1 id="creator-name">SINABON<span class="name-dot">.</span></h1><span class="name-line" aria-hidden="true"></span></div>
      </header>
    </section>
    <section class="links-panel" aria-labelledby="links-title">
      <div class="panel-heading"><span class="eyebrow" id="links-title">ВСЁ НУЖНОЕ — ЗДЕСЬ</span><span class="spark" aria-hidden="true">✳</span></div>
      <div class="link-list">
        <button class="link-card" disabled aria-label="Telegram — ссылка скоро появится"><span class="link-icon telegram" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m21 4-3.2 15c-.2 1-1 1.2-1.8.6l-4.9-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.3-.1-.5-.5-.2L5.5 12.4.8 10.9c-1-.3-1-1 .2-1.5L19.5 2.3c.8-.3 1.6.2 1.5 1.7Z"/></svg></span><span class="link-copy"><strong>Telegram</strong><small>Мой канал</small></span><span class="coming">Скоро</span></button>
        <button class="link-card" disabled aria-label="DonationAlerts — ссылка скоро появится"><span class="link-icon donation" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v8l-4 4H6V4Zm4 4v8h3l2-2v-4l-2-2h-3Z"/></svg></span><span class="link-copy"><strong>DonationAlerts</strong><small>Поддержать стрим</small></span><span class="coming">Скоро</span></button>
        <button class="link-card" disabled aria-label="Donatix — ссылка скоро появится"><span class="link-icon donatix" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z"/></svg></span><span class="link-copy"><strong>Donatix</strong><small>Отправить донат</small></span><span class="coming">Скоро</span></button>
      </div>
      <button class="rules-button" id="open-rules" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M12 3v3m6-1 2 2M12 10v4l2 1"/><circle cx="12" cy="14" r="7"/></svg><span>Правила таймера</span><span class="arrow" aria-hidden="true">↗</span></button>
    </section>
    <footer><a href="/">СОЗДАНО С <strong>EFIR</strong><span aria-hidden="true">↗</span></a></footer>
  </main>
  <dialog id="rules-dialog" aria-labelledby="rules-title" aria-describedby="rules-description">
    <div class="dialog-top"><span class="eyebrow">SINABON / TIMER</span><button id="close-rules" class="close-button" aria-label="Закрыть правила" autofocus>×</button></div>
    <h2 id="rules-title">Правила таймера</h2>
    <p id="rules-description">Правила скоро появятся.</p>
    <button class="dialog-done" id="rules-done">Понятно</button>
  </dialog>
</body>
</html>
